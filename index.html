<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiftSlide</title><style>*{box-sizing:border-box}body{margin:0;background:#0d101a;color:#f5f5ff;font:15px system-ui}main{max-width:900px;margin:45px auto;padding:20px}h1{font-size:42px;letter-spacing:-2px}p,small{color:#a3a8bf}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#191d2b;border:1px solid #33374b;padding:24px;border-radius:20px}.preview{width:100%;aspect-ratio:3/1;object-fit:contain;background:repeating-conic-gradient(#34394a 0 25%,#262a37 0 50%) 0/22px 22px;border-radius:10px}label{display:block;margin:16px 0 6px}input[type=number],select{width:100%;padding:11px;background:#0c0f19;color:white;border:1px solid #43465b;border-radius:9px}button{padding:12px 15px;background:#8978ff;color:white;border:0;border-radius:10px;cursor:pointer;font-weight:bold;margin:8px 6px 8px 0}.secondary{background:#34394d}.gift{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #34394d}.gift img{width:80px}.gift span{flex:1;font-size:13px}.gift input{width:95px;font-size:10px}.url{overflow-wrap:anywhere;font-size:12px;background:#0c0f19;padding:12px;border-radius:9px;color:#c6bfff}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><small>GIFTSLIDE / TIKTOK LIVE</small><h1>Minecraft Gift Overlay</h1><p>5 Belohnungen · Transparenter Hintergrund · Kostenlos · Ohne Server</p><div class="grid"><section class="card"><h3>Live-Vorschau</h3><img id="preview" class="preview" src="assets/1.webp"><label>Wechselzeit in Sekunden</label><input id="seconds" type="number" value="5" min="1" max="120"><label>Überblendung</label><select id="fade"><option value="450">Sanft (450 ms)</option><option value="0">Keine</option><option value="900">Langsam (900 ms)</option></select><label><input id="autoplay" type="checkbox" checked> Automatisch wechseln</label><button id="apply">Übernehmen</button><button id="open" class="secondary">Overlay öffnen ↗</button><label>Link für TikTok LIVE Studio</label><div id="url" class="url"></div><button id="copy" class="secondary">Link kopieren</button></section><section class="card"><h3>Geschenke</h3><div id="gifts"></div><p><small>Eigene Bilder bleiben nur in diesem Browser gespeichert. Für deinen Kollegen sind die fünf mitgelieferten Bilder online sichtbar.</small></p><button id="reset" class="secondary">Standardbilder</button></section></div></main><script>
const names=['Rose → Zombie / Skeleton','Rosa → Lightning Bolt','Donut → Creeper','Handheart → TNT','Galaxy → Warden'],defaults=names.map((_,i)=>`assets/${i+1}.webp`);let images=[...defaults],i=0,timer;const $=id=>document.getElementById(id);
function database(){return new Promise((ok,no)=>{let r=indexedDB.open('giftslide',1);r.onupgradeneeded=()=>r.result.createObjectStore('images');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function saveImage(i,file){let db=await database();await new Promise(ok=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').put(file,String(i));tx.oncomplete=ok});db.close()}
async function loadImages(){let db=await database();await Promise.all(images.map((_,i)=>new Promise(ok=>{let r=db.transaction('images').objectStore('images').get(String(i));r.onsuccess=()=>{if(r.result)images[i]=URL.createObjectURL(r.result);ok()};r.onerror=ok})));db.close()}
function getLink(){let u=new URL('overlay.html',location.href);u.searchParams.set('s',Math.max(1,+$('seconds').value||5));u.searchParams.set('f',$('fade').value);u.searchParams.set('a',$('autoplay').checked?'1':'0');return u.href}
function refresh(){clearInterval(timer);$('preview').src=images[i];$('url').textContent=getLink();if($('autoplay').checked)timer=setInterval(()=>{$('preview').src=images[i=(i+1)%5]},Math.max(1,+$('seconds').value||5)*1000)}
function render(){ $('gifts').replaceChildren();names.forEach((name,n)=>{let div=document.createElement('div');div.className='gift';let img=document.createElement('img');img.src=images[n];let title=document.createElement('span');title.textContent=name;let file=document.createElement('input');file.type='file';file.accept='image/png,image/webp,image/jpeg';file.onchange=async()=>{if(!file.files[0])return;if(file.files[0].size>15e6)return alert('Maximal 15 MB');await saveImage(n,file.files[0]);images[n]=URL.createObjectURL(file.files[0]);render();refresh()};div.append(img,title,file);$('gifts').append(div)})}
$('apply').onclick=()=>{localStorage.setItem('settings',JSON.stringify({s:$('seconds').value,f:$('fade').value,a:$('autoplay').checked}));refresh()};$('open').onclick=()=>window.open(getLink(),'_blank');$('copy').onclick=()=>navigator.clipboard?.writeText(getLink()).then(()=>{$('copy').textContent='Kopiert ✓'}).catch(()=>prompt('Link kopieren',getLink()));$('reset').onclick=async()=>{let db=await database();await new Promise(ok=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').clear();tx.oncomplete=ok});db.close();images=[...defaults];render();refresh()};(async()=>{try{await loadImages()}catch{}let s=JSON.parse(localStorage.getItem('settings')||'null');if(s){$('seconds').value=s.s;$('fade').value=s.f;$('autoplay').checked=s.a}render();refresh()})();
</script></html>
