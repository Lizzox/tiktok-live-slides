<!doctype html><html><meta charset="utf-8"><title>Transparent Gift Overlay</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}img{position:absolute;width:100%;height:100%;object-fit:contain;opacity:0}img.on{opacity:1}</style><img id="one"><img id="two"><script>
let q=new URLSearchParams(location.search),sec=Math.max(1,+q.get('s')||5),fade=Math.max(0,+q.get('f')||450),images=Array.from({length:5},(_,i)=>`assets/${i+1}.webp`),n=0,front=document.getElementById('one'),back=document.getElementById('two');front.style.transition=back.style.transition=`opacity ${fade}ms linear`;
async function load(){return new Promise((done)=>{let r=indexedDB.open('giftslide',1);r.onupgradeneeded=()=>r.result.createObjectStore('images');r.onerror=done;r.onsuccess=()=>{let db=r.result;Promise.all(images.map((_,i)=>new Promise(ok=>{let req=db.transaction('images').objectStore('images').get(String(i));req.onsuccess=()=>{if(req.result)images[i]=URL.createObjectURL(req.result);ok()};req.onerror=ok}))).then(()=>{db.close();done()})}})}
function next(){n=(n+1)%5;back.src=images[n];back.onload=()=>{back.classList.add('on');front.classList.remove('on');[front,back]=[back,front]}}
(async()=>{try{await load()}catch{}front.src=images[0];front.classList.add('on');if(q.get('a')!=='0')setInterval(next,sec*1000)})();
</script></html>
