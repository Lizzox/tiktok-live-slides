<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiftSlide Overlay</title><style>html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}img{position:absolute;width:100%;height:100%;object-fit:contain;opacity:0}img.on{opacity:1}</style></head><body><img id="one"><img id="two"><script>
const q=new URLSearchParams(location.search),sec=Math.max(1,Number(q.get('s'))||5),fade=Math.max(0,Number(q.get('f'))||450),images=Array.from({length:5},(_,i)=>`assets/${i+1}.webp`);let n=0,front=document.getElementById('one'),back=document.getElementById('two');front.style.transition=back.style.transition=`opacity ${fade}ms linear`;function next(){const target=(n+1)%images.length;const preload=new Image();preload.onload=()=>{back.src=preload.src;back.classList.add('on');front.classList.remove('on');[front,back]=[back,front];n=target};preload.src=images[target]}front.src=images[0];front.classList.add('on');if(q.get('a')!=='0')setInterval(next,sec*1000);
</script></body></html>
